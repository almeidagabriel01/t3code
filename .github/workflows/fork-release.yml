name: Fork release

# Publishes the fork's macOS desktop build as a GitHub Release that installed
# apps pick up as an update. Manual only, and never on the upstream repository.
# Bump the version first (`vp run fork:version`) and commit it: the release tag
# is `v<version from apps/desktop/package.json>`. See docs/operations/fork-releases.md.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the GitHub Release. Off builds the artifacts and attaches them to the run only."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS arm64
    if: github.repository != 'pingdotgg/t3code'
    runs-on: macos-latest
    timeout-minutes: 60
    concurrency:
      group: fork-release
      cancel-in-progress: false
    env:
      # Writes the fork's own GitHub feed into the app, so installed copies look for
      # updates here and never at the upstream releases.
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
      # The Apple team that owns the upstream app id also owns its passkey profile, so a
      # fork signs with its own Developer ID and without the Associated Domains entitlement.
      T3CODE_DESKTOP_SKIP_PASSKEY_SIGNING: "true"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history and tags, so the release notes can list what changed since the last release.
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="$(node -p 'require("./apps/desktop/package.json").version')"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-fork\.[0-9]+$ ]]; then
            echo "::error::apps/desktop/package.json says '$version', not X.Y.Z-fork.N. Run 'vp run fork:version' and commit it."
            exit 1
          fi
          for manifest in apps/server apps/web packages/contracts; do
            if [[ "$(node -p "require('./$manifest/package.json').version")" != "$version" ]]; then
              echo "::error::$manifest/package.json is not at $version. Run 'vp run fork:version' and commit it."
              exit 1
            fi
          done
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::error::Release v$version already exists. Bump the version first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Build desktop artifact
        id: build
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          FORK_MAC_SIGNING_P12: ${{ secrets.FORK_MAC_SIGNING_P12 }}
          FORK_MAC_SIGNING_PASSWORD: ${{ secrets.FORK_MAC_SIGNING_PASSWORD }}
        run: |
          args=(--platform mac --target dmg --arch arm64 --build-version "$VERSION" --verbose)

          if [[ -n "$CSC_LINK" && -n "$CSC_KEY_PASSWORD" && -n "$APPLE_API_KEY" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY" > "$key_path"
            export APPLE_API_KEY="$key_path"
            args+=(--signed)
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "macOS signing and notarization enabled."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            # One certificate for every release keeps the app's identity, so macOS keeps its
            # permission grants across versions instead of asking again after each install.
            if [[ -n "$FORK_MAC_SIGNING_P12" && -n "$FORK_MAC_SIGNING_PASSWORD" ]]; then
              keychain="$RUNNER_TEMP/fork-signing.keychain-db"
              keychain_password="$(openssl rand -hex 16)"
              printf '%s' "$FORK_MAC_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/fork-signing.p12"
              security create-keychain -p "$keychain_password" "$keychain"
              security set-keychain-settings "$keychain"
              security unlock-keychain -p "$keychain_password" "$keychain"
              security import "$RUNNER_TEMP/fork-signing.p12" -k "$keychain" -P "$FORK_MAC_SIGNING_PASSWORD" -T /usr/bin/codesign >/dev/null
              security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
              rm "$RUNNER_TEMP/fork-signing.p12"
              # codesign on the runner finds a self-signed identity only in a searched keychain
              # and only once its certificate is trusted for code signing.
              security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
              security find-certificate -a -p "$keychain" > "$RUNNER_TEMP/fork-signing.pem"
              sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/fork-signing.pem"
              security find-identity -v -p codesigning "$keychain"
              identity="$(security find-identity -p codesigning "$keychain" | awk '/"/ { print $2; exit }')"
              if [[ -z "$identity" ]]; then
                echo "::error::FORK_MAC_SIGNING_P12 holds no code signing identity."
                exit 1
              fi
              export T3CODE_MAC_FIXED_IDENTITY="$identity" T3CODE_MAC_FIXED_KEYCHAIN="$keychain"
              echo "Signing with the fork's fixed certificate $identity."
            else
              echo "::warning::FORK_MAC_SIGNING_P12 is missing: macOS will ask for its permissions again after this install."
            fi
            echo "::warning::Apple signing secrets are missing: building an UNSIGNED DMG. Installed apps will announce it with a download link but cannot install it themselves. See docs/operations/fork-releases.md."
          fi

          vp run dist:desktop:artifact "${args[@]}"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for file in release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml; do
            cp "$file" release-publish/
          done
          ls -la release-publish
          if [[ "${{ steps.build.outputs.signed }}" == "true" && ! -f release-publish/latest-mac.yml ]]; then
            echo "::error::The signed build produced no latest-mac.yml, so installed apps could not see this release."
            exit 1
          fi

      # A bundle without a valid signature opens as "damaged" once downloaded: never publish one.
      - name: Verify the app opens after download
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "${{ steps.build.outputs.signed }}" == "true" ]]; then flags+=(--notarized); fi
          bash scripts/verify-mac-desktop-artifact.sh "${flags[@]+"${flags[@]}"}" release-publish/*.dmg release-publish/*.zip

      # Packaging can succeed and the app still not open: launch the shipped DMG's app.
      - name: Launch check
        shell: bash
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/desktop-launch-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$(ls release-publish/*.dmg)"
          trap 'hdiutil detach "$mount" -force >/dev/null || true' EXIT
          app=$(ls -d "$mount"/*.app)
          executable=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Contents/Info.plist")
          node scripts/smoke-desktop-app.ts --artifacts-dir "$RUNNER_TEMP/desktop-launch-check" --executable "$app/Contents/MacOS/$executable"

      - name: Upload launch check output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fork-desktop-launch-check
          path: ${{ runner.temp }}/desktop-launch-check
          if-no-files-found: ignore

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fork-desktop-mac-arm64
          path: release-publish/*
          if-no-files-found: error

      # Not a draft and not a prerelease: electron-updater's GitHub provider follows the
      # repository's latest release and skips anything flagged prerelease, even though
      # `-fork.N` is a semver prerelease.
      - name: Create GitHub Release
        if: inputs.publish
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.build.outputs.signed }}
        run: |
          notes="Fork release $VERSION, based on upstream v${VERSION%%-fork.*}."
          if [[ "$SIGNED" != "true" ]]; then
            notes="$notes Unsigned build: install it from the DMG. Installed copies announce new versions and open this page to download them."
          fi
          previous="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [[ -n "$previous" ]] && git rev-parse -q --verify "refs/tags/$previous" >/dev/null; then
            # First parent only: an upstream merge reads as one line, not every upstream commit.
            log="$(git log --first-parent --format=%s "$previous..$GITHUB_SHA")"
            section() {
              local items
              items="$(grep -E "^($2)(\([^)]*\))?!?: " <<<"$log" | sed -E 's/^[a-z]+(\([^)]*\))?!?: //' |
                awk '!seen[$0]++ { print "- " toupper(substr($0, 1, 1)) substr($0, 2) }' || true)"
              [[ -n "$items" ]] && printf '\n\n### %s\n\n%s' "$1" "$items"
              return 0
            }
            changes="$(section Features feat)$(section Fixes 'fix|perf')$(section Upstream merge)"
            notes="$notes"$'\n\n'"## Changes since $previous${changes:-$'\n\nMaintenance only.'}"
          fi
          gh release create "v$VERSION" release-publish/* \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes "$notes" \
            --latest
